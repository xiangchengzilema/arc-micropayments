version: "3.8"

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_PORT=5000
      - FLASK_DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - CIRCLE_API_KEY=${CIRCLE_API_KEY:-}
      - CIRCLE_ENTITY_SECRET=${CIRCLE_ENTITY_SECRET:-}
      - DATABASE_PATH=/data/payments.db
    volumes:
      - app-data:/data
    restart: unless-stopped

volumes:
  app-data:
